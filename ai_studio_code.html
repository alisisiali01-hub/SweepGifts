  <!-- Tailwind CSS CDN -->

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'IBM Plex Sans Arabic', 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #050b18;
      color: #f1f5f9;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    .font-brand {
      font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    /* Wavy awakening animation for S and G */
    @keyframes waveAwakenS {
      0% {
        color: #ffffff;
        filter: drop-shadow(0 0 0px transparent);
      }
      45% {
        color: #67e8f9;
        filter: drop-shadow(0 0 24px rgba(56, 182, 255, 0.75));
      }
      100% {
        color: #38b6ff;
        filter: drop-shadow(0 0 16px rgba(56, 182, 255, 0.35));
      }
    }

    @keyframes waveAwakenG {
      0% {
        color: #ffffff;
        filter: drop-shadow(0 0 0px transparent);
      }
      45% {
        color: #67e8f9;
        filter: drop-shadow(0 0 24px rgba(56, 182, 255, 0.75));
      }
      100% {
        color: #38b6ff;
        filter: drop-shadow(0 0 16px rgba(56, 182, 255, 0.35));
      }
    }

    .animate-wave-s {
      color: #ffffff;
      animation: waveAwakenS 0.95s cubic-bezier(0.25, 1, 0.5, 1) 0.08s forwards;
    }

    .animate-wave-g {
      color: #ffffff;
      animation: waveAwakenG 0.95s cubic-bezier(0.25, 1, 0.5, 1) 0.28s forwards;
    }

    /* Subtle shake animation on SG click */
    @keyframes subtleShake {
      0%, 100% { transform: translateX(0) rotate(0deg) scale(1); }
      15% { transform: translateX(-3px) rotate(-4deg) scale(1.05); }
      30% { transform: translateX(3px) rotate(4deg) scale(1.05); }
      45% { transform: translateX(-2.5px) rotate(-2deg) scale(1.03); }
      60% { transform: translateX(2px) rotate(2deg) scale(1.02); }
      75% { transform: translateX(-1px) rotate(-1deg) scale(1.01); }
      90% { transform: translateX(0.5px) rotate(0.5deg) scale(1); }
    }

    .animate-subtle-shake {
      animation: subtleShake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    /* Smooth non-flashing continuous sheen on emerald green numbers */
    @keyframes smoothSheen {
      0% {
        background-position: -200% 0;
      }
      100% {
        background-position: 200% 0;
      }
    }

    .amount-sword-sheen {
      background: linear-gradient(
        120deg,
        #10b981 0%,
        #10b981 36%,
        #34d399 44%,
        #a7f3d0 48%,
        #ffffff 51%,
        #a7f3d0 54%,
        #34d399 58%,
        #10b981 66%,
        #10b981 100%
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.35));
      animation: smoothSheen 3.2s linear infinite;
      display: inline-block;
    }
  </style>
</head>

  <!-- Interactive JavaScript -->
  <script>
    // Slider state
    let currentSlide = 0;
    let isAutoPlaying = true;
    let pauseTimeout = null;

    const sliderContent = document.getElementById('slider-content');
    const dot0 = document.getElementById('dot-0');
    const dot1 = document.getElementById('dot-1');

    function renderSlide() {
      if (currentSlide === 0) {
        sliderContent.innerHTML = `
          <div class="flex items-center justify-center gap-1.5 sm:gap-2 whitespace-nowrap transition-all duration-300">
            <svg class="w-4 h-4 sm:w-5 sm:h-5 text-amber-400 shrink-0 animate-pulse" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
            </svg>
            <span class="text-sm sm:text-base md:text-lg font-bold text-amber-300 font-brand tracking-wide">
              Notice: Open to U.S. Residents Only
            </span>
          </div>
        `;
        dot0.className = "h-1.5 rounded-full transition-all duration-300 cursor-pointer w-5 bg-sky-400";
        dot1.className = "h-1.5 rounded-full transition-all duration-300 cursor-pointer w-1.5 bg-blue-900/80 hover:bg-sky-400/40";
      } else {
        sliderContent.innerHTML = `
          <div class="flex items-center justify-center gap-2 whitespace-nowrap transition-all duration-300">
            <span class="text-sm sm:text-base md:text-lg font-medium text-slate-200">
              You can participate for
            </span>
            <span class="font-extrabold text-sm sm:text-base md:text-lg text-sky-400 font-brand tracking-wide inline-block px-2.5 py-0.5 rounded-lg bg-sky-950/80 border border-sky-400/40 shadow-xs shadow-sky-500/20 align-middle">
              FREE
            </span>
          </div>
        `;
        dot0.className = "h-1.5 rounded-full transition-all duration-300 cursor-pointer w-1.5 bg-blue-900/80 hover:bg-sky-400/40";
        dot1.className = "h-1.5 rounded-full transition-all duration-300 cursor-pointer w-5 bg-sky-400";
      }
    }

    function pauseAutoPlay() {
      isAutoPlaying = false;
      if (pauseTimeout) clearTimeout(pauseTimeout);
      pauseTimeout = setTimeout(() => { isAutoPlaying = true; }, 4000);
    }

    function toggleSlide() {
      currentSlide = currentSlide === 0 ? 1 : 0;
      renderSlide();
    }

    // Auto-cycle every 3 seconds
    setInterval(() => {
      if (isAutoPlaying) {
        toggleSlide();
      }
    }, 3000);

    document.getElementById('prev-slide-btn').addEventListener('click', () => {
      pauseAutoPlay();
      toggleSlide();
    });

    document.getElementById('next-slide-btn').addEventListener('click', () => {
      pauseAutoPlay();
      toggleSlide();
    });

    sliderContent.addEventListener('click', () => {
      pauseAutoPlay();
      toggleSlide();
    });

    dot0.addEventListener('click', () => {
      pauseAutoPlay();
      currentSlide = 0;
      renderSlide();
    });

    dot1.addEventListener('click', () => {
      pauseAutoPlay();
      currentSlide = 1;
      renderSlide();
    });

    // Initial render
    renderSlide();

    // Replay Wave Animation on Main Title Click
    const mainTitle = document.getElementById('main-title');
    const titleS = document.getElementById('title-s');
    const titleG = document.getElementById('title-g');

    mainTitle.addEventListener('click', () => {
      titleS.classList.remove('animate-wave-s');
      titleG.classList.remove('animate-wave-g');
      void titleS.offsetWidth; // Trigger reflow
      void titleG.offsetWidth;
      titleS.classList.add('animate-wave-s');
      titleG.classList.add('animate-wave-g');
    });

    // Shake SG Logo on Click
    const sgContainer = document.getElementById('sg-container');
    const sgText = document.getElementById('sg-text');
    sgContainer.addEventListener('click', () => {
      sgText.classList.remove('animate-subtle-shake');
      void sgText.offsetWidth;
      sgText.classList.add('animate-subtle-shake');
    });

    // Card click selection effect
    const brandBtns = document.querySelectorAll('.brand-btn');
    brandBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const cardBox = btn.querySelector('div');
        const isSelected = cardBox.classList.contains('border-sky-400/60');
        
        // Deselect all
        brandBtns.forEach(b => {
          const box = b.querySelector('div');
          box.classList.remove('border-sky-400/60', 'ring-2', 'ring-sky-400/25');
          box.classList.add('border-slate-100');
        });

        if (!isSelected) {
          cardBox.classList.remove('border-slate-100');
          cardBox.classList.add('border-sky-400/60', 'ring-2', 'ring-sky-400/25');
        }
      });
    });
  </script>
